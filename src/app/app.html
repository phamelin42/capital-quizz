<header class="app-header">
  <h1 class="app-title">Flag Quizz</h1>
  <ul class="app-stats" aria-label="Ton score">
    <li>
      <fd-badge tone="sakura" soft>Score {{ quiz.score() }} / {{ quiz.asked() }}</fd-badge>
    </li>
    <li>
      <fd-badge tone="yamabuki" soft>Série {{ quiz.streak() }}</fd-badge>
    </li>
    <li>
      <fd-badge>Record {{ quiz.bestStreak() }}</fd-badge>
    </li>
  </ul>
  <fd-switch [checked]="isDark()" (checkedChange)="setDark($event)">Thème nuit</fd-switch>
</header>

<main class="app-main">
  <section class="app-play">
    <app-flag-card [country]="quiz.question().country" [revealed]="quiz.isAnswered()" />
    <app-answer-options />
  </section>

  <!-- Rien ne s'affiche avant la réponse : l'anecdote et la carte donneraient la solution. -->
  @if (quiz.isAnswered()) {
    <div class="app-bottom">
      <app-fun-fact [country]="quiz.question().country" />
      <app-map-panel [country]="quiz.question().country" />
    </div>
  }
</main>
